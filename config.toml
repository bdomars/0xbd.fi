baseurl = "https://0xbd.fi"
title = "0xbd.fi"

theme = "hugo-coder"

languagecode = "en"
defaultcontentlanguage = "en"

paginate = 20
canonifyurls = true

pygmentsstyle = "b2"
pygmentscodefences = true
pygmentscodefencesguesssyntax = true

googleAnalytics = "UA-141218930-1"

[params]
    author = "Björn Domars"
    description = "Björn's personal website"
    keywords = "blog,developer,personal"
    info = "Software Engineer and Tinkerer"
    avatarurl = "images/avatar.jpg"
    footercontent = "Always carry a towel."

    dateformat = "January 2, 2006"

    hideCredits = false
    hideCopyright = true

    # Git Commit in Footer, uncomment the line below to enable it.
    #commit = "https://github.com/luizdepra/hugo-coder/tree/"

    # Use inverted colors
    inverted = false

    # Series see also post count
    maxSeeAlsoItems = 5

    # Custom CSS
    custom_css = [ "custom.css" ]

    # Custom JS
    custom_js = []

[taxonomies]
  category = "categories"
  series = "series"
  tag = "tags"

[[params.social]]
    name = "Facebook"
    icon = "fab fa-facebook"
    weight = 1
    url = "https://facebook.com/bjorn.domars"
[[params.social]]
    name = "Github"
    icon = "fab fa-github"
    weight = 2
    url = "https://github.com/bdomars/"
[[params.social]]
    name = "LinkedIn"
    icon = "fab fa-linkedin"
    weight = 3
    url = "https://www.linkedin.com/in/bdomars/"
[[params.social]]
    name = "Steam"
    icon = "fab fa-steam"
    weight = 4
    url = "https://steamcommunity.com/id/elbjorno/"


[languages]
    [languages.en]
        languagename = "English"

        [[languages.en.menu.main]]
        name = "About"
