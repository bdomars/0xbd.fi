baseURL = "https://0xbd.fi"
title = "0xbd.fi"

locale = "en"
defaultContentLanguage = "en"

canonifyURLs = true

[pagination]
    pagerSize = 20

[markup]
    [markup.highlight]
        style = "b2"
        guessSyntax = true

[params]
    author = "Björn Domars"
    description = "Björn's personal website"
    keywords = "blog,developer,personal"
    info = "Software Engineer and Tinkerer"
    avatarURL = "images/avatar.jpg"
    footerContent = "Always carry a towel."

    dateFormat = "January 2, 2006"

    hideCredits = false
    hideCopyright = true

    # Specify light/dark colorscheme: "auto", "dark" or "light"
    colorScheme = "auto"
    hideColorSchemeToggle = false

    # Series see also post count
    maxSeeAlsoItems = 5

    # Custom CSS
    customCSS = [ "custom.css" ]

    # Custom JS
    customJS = []

    [params.goatCounter]
        code = "bdomars"

[taxonomies]
  category = "categories"
  series = "series"
  tag = "tags"

[[params.social]]
    name = "Github"
    icon = "fa-brands fa-github fa-2x"
    weight = 2
    url = "https://github.com/bdomars/"
[[params.social]]
    name = "LinkedIn"
    icon = "fa-brands fa-linkedin fa-2x"
    weight = 3
    url = "https://www.linkedin.com/in/bdomars/"
[[params.social]]
    name = "Steam"
    icon = "fa-brands fa-steam fa-2x"
    weight = 4
    url = "https://steamcommunity.com/id/elbjorno/"


[languages]
    [languages.en]
        label = "English"

        [[languages.en.menu.main]]
        name = "About"
        weight = 1
        url = "/about/"

        [[languages.en.menu.main]]
        name = "Contact"
        weight = 4
        url = "/contact/"

[module]
  [[module.imports]]
    path = "github.com/luizdepra/hugo-coder"
