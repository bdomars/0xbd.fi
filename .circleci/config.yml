version: 2.1

executors:
  hugo:
    docker:
      - image: cimg/go:1.27
    environment:
      HUGO_VERSION: 0.167.0

commands:
  install-hugo:
    steps:
      - run:
          name: Install Hugo extended
          command: |
            curl -sSLo /tmp/hugo.deb "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
            sudo dpkg -i /tmp/hugo.deb
            hugo version

jobs:
  build:
    executor: hugo
    steps:
      - checkout
      - install-hugo
      - run: hugo
  deploy:
    executor: hugo
    steps:
      - checkout
      - install-hugo
      - run: hugo
      - run: sudo apt-get update && sudo apt-get install -y rsync
      - run: rsync -av --delete -e "ssh -o StrictHostKeyChecking=accept-new" public/ bdomars@0xbd.fi:/srv/www/0xbd.fi
workflows:
  version: 2
  build-n-deploy:
    jobs:
      - build
      - deploy:
          requires:
            - build
          filters:
            branches:
              only: master
