version: 2.1
jobs:
  build:
    docker:
      - image: jguyomard/hugo-builder
    steps:
      - checkout
      - run: hugo
  deploy:
    docker:
      - image: jguyomard/hugo-builder
    steps:
      - checkout
      - run: hugo
      - run: rsync -av -e "ssh -p 3022 -o StrictHostKeyChecking=accept-new" public/ bdomars@0xbd.fi:/srv/www/0xbd.fi
workflows:
  version: 2
  build-n-deploy:
    jobs:
      - build
      - deploy:
          requires:
            - build
          filters:
            branches:
              only: master
